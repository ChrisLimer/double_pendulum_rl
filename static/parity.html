<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sim Parity Check</title>
  <style>
    :root { --bg: #111316; --text: #dde1e6; --muted: #8a919b; --good: #5fd68a; --bad: #ff6b6b; --border: #2a2e35; }
    body { margin: 0; padding: 1rem; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
    table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    td, th { padding: 0.3rem 0.8rem; border-bottom: 1px solid var(--border); text-align: left; }
    .pass { color: var(--good); } .fail { color: var(--bad); } .muted { color: var(--muted); }
  </style>
</head>
<body>
  <h1>Python ↔ JavaScript parity</h1>
  <p class="muted">One control step from random states with random cart and tip forces, the policy's
    action and the track shield's decision, computed by dprl/env.py (JAX, float32) and static/sim.mjs (float64).
    Run this after changing either.</p>
  <div id="out">running…</div>
  <script type="module">
    import { integrate, obs, policyAction, loadPolicy, pendulumEnergy, shield, wrap } from "./sim.mjs";

    const run = new URLSearchParams(location.search).get("run");
    const runParam = (sep) => (run ? `${sep}run=${encodeURIComponent(run)}` : "");
    const [ref, pol] = await Promise.all([
      fetch("/api/parity?n=200" + runParam("&")).then((r) => r.json()),
      fetch("/api/policy" + runParam("?")).then((r) => r.json()),
    ]);
    const env = pol.env, policy = loadPolicy(pol.layers, pol.symmetric);
    const worst = { next_q: 0, next_qd: 0, obs: 0, action: 0, pend_energy: 0, shield: 0 };
    // Relative error, with angles compared modulo 2*pi.
    const err = (a, b, angle = false) => Math.abs(angle ? wrap(a - b) : a - b) / (1 + Math.abs(b));
    for (let n = 0; n < ref.q.length; n++) {
      const { q, qd } = integrate(env, ref.q[n], ref.qd[n], ref.force[n], ref.tip[n]);
      for (let i = 0; i < 3; i++) {
        worst.next_q = Math.max(worst.next_q, err(q[i], ref.next_q[n][i], i > 0));
        worst.next_qd = Math.max(worst.next_qd, err(qd[i], ref.next_qd[n][i]));
      }
      const o = obs(env, ref.q[n], ref.qd[n]);
      o.forEach((v, i) => (worst.obs = Math.max(worst.obs, err(v, ref.obs[n][i]))));
      worst.action = Math.max(worst.action, err(policyAction(policy, o), ref.action[n]));
      worst.pend_energy = Math.max(worst.pend_energy, err(pendulumEnergy(env, ref.q[n], ref.qd[n]), ref.pend_energy[n]));
      const [a, active] = shield(env, ref.shield_q[n], ref.shield_qd[n], ref.shield_a[n]);
      worst.shield = Math.max(worst.shield, err(a, ref.shielded[n]), Number(active) !== ref.shield_active[n] ? 1 : 0);
    }
    const TOL = 1e-3;  // float32 vs float64 differences are ~1e-6; real bugs are >> 1e-3
    const pass = Object.values(worst).every((v) => v < TOL);
    window.parityResult = { pass, worst, checkpoint: ref.checkpoint };
    document.getElementById("out").innerHTML = `
      <p>Checkpoint <b>${ref.checkpoint}</b>, ${ref.q.length} random states, tolerance ${TOL} (relative).</p>
      <table><tr><th>quantity</th><th>max error</th><th></th></tr>
      ${Object.entries(worst).map(([k, v]) =>
        `<tr><td>${k}</td><td>${v.toExponential(2)}</td><td class="${v < TOL ? "pass" : "fail"}">${v < TOL ? "pass" : "FAIL"}</td></tr>`).join("")}
      </table>
      <h2 class="${pass ? "pass" : "fail"}">${pass ? "All match" : "Mismatch: the JS simulator differs from the Python environment"}</h2>`;
  </script>
</body>
</html>
