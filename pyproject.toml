[project]
name = "double-pendulum-rl"
version = "0.1.0"
description = "One PPO policy (JAX) that swings up, balances and recovers a double inverted pendulum on a cart, with a live browser dashboard"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "jax>=0.11.2",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
